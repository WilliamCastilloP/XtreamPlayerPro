# Builds the XTREAM Fire TV / Android TV APK from native/android.
# A tag v* (or android-v*) publishes GitHub Release assets named XTREAM.apk
# (stable URL for the Fire Stick Downloader app and the in-app updater).
# Prefer `v0.14.0` so installs still on 0.12.0 (old UpdateChecker) see the release as newer.
name: XTREAM Android APK

on:
  pull_request:
    paths:
      - "native/android/**"
      - ".github/workflows/android-apk.yml"
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xtream-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: native/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships an Android SDK. The setup-android action tries
      # to install the retired `tools` package and fails. Accept licenses so AGP
      # can download platform 35 the same way OpenTV's own workflow does.
      - name: Accept Android SDK licenses
        working-directory: .
        run: |
          set -euo pipefail
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SM" --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: native/android

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the artifact
        id: artifact
        run: |
          SOURCE=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SOURCE" ]; then
            echo "::error::No APK was produced by assembleRelease"
            exit 1
          fi
          mkdir -p dist
          cp "$SOURCE" dist/XTREAM.apk
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            cp "$SOURCE" "dist/XTREAM-${GITHUB_REF_NAME}.apk"
          fi
          echo "apk=native/android/dist/XTREAM.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XTREAM-apk
          path: native/android/dist/*.apk
          if-no-files-found: error

      # The in-app update dialog shows this file up to the "Built by GitHub Actions" line.
      # That line has to stay: UpdateChecker.cleanNotes drops everything from it downward,
      # so the Stick sees the changelog and not the install boilerplate.
      - name: Release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#android-}"
          awk -v v="$VERSION" '$0 ~ ("^## " v "([^0-9]|$)"){f=1;next} /^## /{f=0} f{print}' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}. The update dialog shows that section, so add ## ${VERSION} before tagging."
            exit 1
          fi
          {
            echo ""
            echo "Built by GitHub Actions from the tagged commit."
            echo ""
            echo "Do not uninstall. This APK upgrades in place and keeps providers, favourites and watch history."
            echo "Fire Stick — Downloader code: 8417717 (https://aftv.news/8417717)"
            echo "Direct APK: https://github.com/WilliamCastilloP/XtreamPlayerPro/releases/latest/download/XTREAM.apk"
            echo "In the app: Settings → About → Check for updates."
          } >> "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: native/android/dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true
          body_path: ${{ runner.temp }}/release-notes.md
